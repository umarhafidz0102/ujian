```
<nav class="navbar">

    <div class="brand">

        <div class="brand-icon">

        <div>
            <h2>Student Management</h2>
            <span>REST API • db_sekolah</span>

    </div>

    <div class="nav-actions">

        <button
            class="nav-btn dark-btn"

        >

            class="nav-btn logout-btn"

<main class="container">

    <div class="welcome">
        <h1>Data Siswa</h1>
        <p>Kelola data siswa melalui REST API.</p>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-title">Total Siswa</div>
            <div class="stat-number" id="totalSiswa">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Total Kelas</div>
            <div class="stat-number" id="totalKelas">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Total Jurusan</div>
            <div class="stat-number" id="totalJurusan">0</div>
        </div>

    </div>

    <div id="pesan"></div>

    <div class="card">

        <div class="card-header">
            <h2 id="formTitle">Tambah Siswa</h2>
        </div>

        <form id="formSiswa">

            <div class="form-grid">

                <div class="form-group">
                    <label for="nis">NIS</label>
                    <input
                        type="text"
                        id="nis"
                        placeholder="Contoh: 2026001"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input
                        type="text"
                        id="nama"
                        placeholder="Nama lengkap siswa"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="kelas">Kelas</label>
                    <input
                        type="text"
                        id="kelas"
                        placeholder="Contoh: XI RPL 1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="jurusan">Jurusan</label>
                    <input
                        type="text"
                        id="jurusan"
                        placeholder="Contoh: Rekayasa Perangkat Lunak"
                        required
                    >
                </div>

                <div class="form-group full">
                    <label for="alamat">Alamat</label>
                    <input
                        type="text"
                        id="alamat"
                        placeholder="Alamat siswa"
                        required
                    >
                </div>

            </div>

            <div class="form-buttons">

                <button type="submit" id="btnSimpan">
                    + Tambah Siswa
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="btnBatal"
                    onclick="batalEdit()"
                    style="display: none;"
                >
                    Batal
                </button>

            </div>

        </form>

    </div>

    <div class="card">

        <div class="card-header">
            <h2>Daftar Siswa</h2>
        </div>

        <div class="search-area">

            <input
                type="text"
                id="search"
                placeholder="🔎 Cari NIS atau nama siswa..."
                oninput="filterSiswa()"
            >

            <select id="filterKelas" onchange="filterSiswa()">
                <option value="">Semua Kelas</option>
            </select>

        </div>

        <div id="loading" class="loading">

            <div class="spinner"></div>

            <div>
                Mengambil data siswa...
            </div>

        </div>

        <div class="table-wrapper">

            <table id="tableSiswa" style="display: none;">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>NIS</th>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Jurusan</th>
                        <th>Alamat</th>
                        <th>Aksi</th>
                    </tr>

                </thead>

                <tbody id="dataSiswa"></tbody>

            </table>

        <div
            id="empty"
            class="empty"

            Data siswa tidak ditemukan.

</main>

<script>

    // URL utama REST API siswa
    const API_URL = "http://localhost:3000/api/siswa";

    // Menyimpan semua data siswa dari database
    let semuaSiswa = [];

    // Menyimpan ID siswa yang sedang diedit
    let editId = null;


    // Mengambil data siswa ketika halaman dibuka
    document.addEventListener("DOMContentLoaded", function() {

        // Memanggil fungsi untuk mengambil data
        getSiswa();

    });


    // Fungsi GET untuk mengambil semua data siswa
    async function getSiswa() {

        // Menampilkan loading
        document.getElementById("loading").style.display = "block";

        // Menyembunyikan tabel sementara
        document.getElementById("tableSiswa").style.display = "none";

        try {

            // Mengirim request GET ke REST API
            const response = await fetch(API_URL);

            // Mengecek apakah request berhasil
            if (!response.ok) {
                throw new Error("Gagal mengambil data siswa");
            }

            // Mengubah response API menjadi JSON
            const hasil = await response.json();

            // Menyimpan data siswa ke variable
            semuaSiswa = hasil.data;

            // Menampilkan data ke tabel
            tampilkanSiswa(semuaSiswa);

            // Membuat filter kelas
            buatFilterKelas();

            // Menghitung statistik
            updateStatistik();

        } catch (error) {

            // Menampilkan pesan error
            tampilkanPesan(error.message, "error");

        } finally {

            // Menghilangkan loading
            document.getElementById("loading").style.display = "none";

        }
    }


    // Menampilkan data siswa ke dalam tabel
    function tampilkanSiswa(data) {

        // Mengambil elemen tbody
        const tbody = document.getElementById("dataSiswa");

        // Mengosongkan isi tabel
        tbody.innerHTML = "";

        // Jika data kosong
        if (data.length === 0) {

            document.getElementById("tableSiswa").style.display = "none";

            document.getElementById("empty").style.display = "block";

            return;
        }

        // Menampilkan tabel
        document.getElementById("tableSiswa").style.display = "table";

        // Menyembunyikan pesan data kosong
        document.getElementById("empty").style.display = "none";

        // Melakukan perulangan setiap siswa
        data.forEach(function(siswa) {

            // Membuat baris tabel
            const tr = document.createElement("tr");

            // Mengisi data siswa ke dalam baris
            tr.innerHTML = `
                <td>${siswa.id}</td>
                <td>${siswa.nis}</td>
                <td>${siswa.nama}</td>
                <td>${siswa.kelas}</td>
                <td>${siswa.jurusan}</td>
                <td>${siswa.alamat}</td>

                <td>
                    <div class="action">

                        <button
                            class="edit-btn"
                            onclick="editSiswa(${siswa.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="hapusSiswa(${siswa.id})"
                        >
                            Hapus
                        </button>

                    </div>
                </td>
            `;

            // Memasukkan baris ke tabel
            tbody.appendChild(tr);

        });
    }


    // Menjalankan proses ketika form siswa dikirim
    document.getElementById("formSiswa").addEventListener(
        "submit",
        async function(event) {

            // Mencegah halaman reload
            event.preventDefault();

            // Mengambil data dari form
            const data = {
                nis: document.getElementById("nis").value.trim(),
                nama: document.getElementById("nama").value.trim(),
                kelas: document.getElementById("kelas").value.trim(),
                jurusan: document.getElementById("jurusan").value.trim(),
                alamat: document.getElementById("alamat").value.trim()
            };

            // Mengecek apakah sedang edit atau tambah
            if (editId) {

                // Memanggil fungsi PUT
                await updateSiswa(editId, data);

            } else {

                // Memanggil fungsi POST
                await tambahSiswa(data);

            }
        }
    );


    // Fungsi POST untuk menambahkan siswa
    async function tambahSiswa(data) {

        try {

            // Mengirim data menggunakan method POST
            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                // Mengubah object menjadi JSON
                body: JSON.stringify(data)

            });

            // Mengambil response dari API
            const hasil = await response.json();

            // Mengecek response
            if (!response.ok) {
                throw new Error(
                    hasil.message || "Gagal menambahkan siswa"
                );
            }

            // Menampilkan pesan berhasil
            tampilkanPesan(
                "Data siswa berhasil ditambahkan",
                "success"
            );

            // Mengosongkan form
            document.getElementById("formSiswa").reset();

            // Mengambil ulang data dari database
            getSiswa();

        } catch (error) {

            // Menampilkan error
            tampilkanPesan(error.message, "error");

        }
    }


    // Fungsi untuk mengambil data siswa berdasarkan ID
    async function editSiswa(id) {

        try {

            // Mengambil satu siswa dari API
            const response = await fetch(`${API_URL}/${id}`);

            // Mengubah response menjadi JSON
            const hasil = await response.json();

            // Mengecek response
            if (!response.ok) {
                throw new Error(
                    hasil.message || "Data siswa tidak ditemukan"
                );
            }

            // Mengambil data siswa
            const siswa = hasil.data;

            // Memasukkan data ke form
            document.getElementById("nis").value = siswa.nis;
            document.getElementById("nama").value = siswa.nama;
            document.getElementById("kelas").value = siswa.kelas;
            document.getElementById("jurusan").value = siswa.jurusan;
            document.getElementById("alamat").value = siswa.alamat;

            // Menyimpan ID siswa yang diedit
            editId = siswa.id;

            // Mengubah judul form
            document.getElementById("formTitle").textContent =
                "Edit Data Siswa";

            // Mengubah tulisan tombol
            document.getElementById("btnSimpan").textContent =
                "Simpan Perubahan";

            // Menampilkan tombol batal
            document.getElementById("btnBatal").style.display =
                "block";

            // Scroll ke bagian atas form
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        } catch (error) {

            // Menampilkan error
            tampilkanPesan(error.message, "error");

        }
    }


    // Fungsi PUT untuk mengubah data siswa
    async function updateSiswa(id, data) {

        try {

            // Mengirim data menggunakan method PUT
            const response = await fetch(`${API_URL}/${id}`, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                // Mengirim data siswa dalam bentuk JSON
                body: JSON.stringify(data)

            });

            // Mengambil response API
            const hasil = await response.json();

            // Mengecek response
            if (!response.ok) {
                throw new Error(
                    hasil.message || "Gagal mengubah siswa"
                );
            }

            // Menampilkan pesan berhasil
            tampilkanPesan(
                "Data siswa berhasil diubah",
                "success"
            );

            // Mengembalikan form ke mode tambah
            batalEdit();

            // Mengambil data terbaru
            getSiswa();

        } catch (error) {

            // Menampilkan error
            tampilkanPesan(error.message, "error");

        }
    }


    // Fungsi DELETE untuk menghapus siswa
    async function hapusSiswa(id) {

        // Meminta konfirmasi sebelum menghapus
        const yakin = confirm(
            "Apakah kamu yakin ingin menghapus data siswa ini?"
        );

        // Jika user memilih batal
        if (!yakin) {
            return;
        }

        try {

            // Mengirim request DELETE
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            // Mengambil response API
            const hasil = await response.json();

            // Mengecek response
            if (!response.ok) {
                throw new Error(
                    hasil.message || "Gagal menghapus siswa"
                );
            }

            // Menampilkan pesan berhasil
            tampilkanPesan(
                "Data siswa berhasil dihapus",
                "success"
            );

            // Mengambil data terbaru
            getSiswa();

        } catch (error) {

            // Menampilkan pesan error
            tampilkanPesan(error.message, "error");

        }
    }


    // Membatalkan proses edit
    function batalEdit() {

        // Menghapus ID edit
        editId = null;

        // Mengosongkan form
        document.getElementById("formSiswa").reset();

        // Mengembalikan judul form
        document.getElementById("formTitle").textContent =
            "Tambah Siswa";

        // Mengembalikan tulisan tombol
        document.getElementById("btnSimpan").textContent =
            "+ Tambah Siswa";

        // Menyembunyikan tombol batal
        document.getElementById("btnBatal").style.display =
            "none";
    }


    // Fungsi untuk mencari siswa
    function filterSiswa() {

        // Mengambil kata pencarian
        const search = document
            .getElementById("search")
            .value
            .toLowerCase();

        // Mengambil filter kelas
        const kelas = document.getElementById("filterKelas").value;

        // Memfilter data siswa
        const hasil = semuaSiswa.filter(function(siswa) {

            const cocokSearch =
                siswa.nis.toLowerCase().includes(search) ||
                siswa.nama.toLowerCase().includes(search);

            const cocokKelas =
                kelas === "" ||
                siswa.kelas === kelas;

            return cocokSearch && cocokKelas;
        });

        // Menampilkan hasil filter
        tampilkanSiswa(hasil);
    }


    // Membuat pilihan filter berdasarkan kelas
    function buatFilterKelas() {

        const select = document.getElementById("filterKelas");

        // Menyimpan daftar kelas unik
        const kelas = [
            ...new Set(
                semuaSiswa.map(function(siswa) {
                    return siswa.kelas;
                })
            )
        ];

        // Mengosongkan pilihan sebelumnya
        select.innerHTML =
            '<option value="">Semua Kelas</option>';

        // Menambahkan kelas ke filter
        kelas.forEach(function(item) {

            const option = document.createElement("option");

            option.value = item;
            option.textContent = item;

            select.appendChild(option);

        });
    }


    // Menghitung jumlah siswa, kelas, dan jurusan
    function updateStatistik() {

        // Total siswa
        document.getElementById("totalSiswa").textContent =
            semuaSiswa.length;

        // Total kelas unik
        const kelas = new Set(
            semuaSiswa.map(function(siswa) {
                return siswa.kelas;
            })
        );

        // Total jurusan unik
        const jurusan = new Set(
            semuaSiswa.map(function(siswa) {
                return siswa.jurusan;
            })
        );

        document.getElementById("totalKelas").textContent =
            kelas.size;

        document.getElementById("totalJurusan").textContent =
            jurusan.size;
    }


    // Menampilkan pesan sukses atau error
    function tampilkanPesan(text, type) {

        const pesan = document.getElementById("pesan");

        // Mengisi pesan
        pesan.textContent = text;

        // Menentukan class warna
        pesan.className = type;

        // Menampilkan pesan
        pesan.style.display = "block";

        // Menghilangkan pesan setelah 3 detik
        setTimeout(function() {
            pesan.style.display = "none";
        }, 3000);
    }


    // Mengaktifkan atau menonaktifkan dark mode
    function toggleDarkMode() {

        // Menambahkan/menghapus class dark
        document.body.classList.toggle("dark");
    }


    // Fungsi logout
    function logout() {

        // Menghapus token login
        localStorage.removeItem("token");

        // Menghapus data user
        localStorage.removeItem("user");

        // Kembali ke halaman login
        window.location.href = "login.html";
    }
