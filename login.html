```
<div class="background">
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>
</div>

<div class="login-box">

    <div class="icon">
        🔐
    </div>

    <h1>Selamat Datang</h1>

    <p class="subtitle">
        Login untuk mengakses<br>
        Student Management System
    </p>

    <form id="formLogin">

        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Masukkan email kamu"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Masukkan password kamu"
                required
            >
        </div>

        <button type="submit" id="btnLogin">
            Login
        </button>

    </form>

    <div id="pesan"></div>

    <div class="info">
        🔒 Gunakan email dan password yang sudah terdaftar di database.
    </div>

    <div class="footer">
        Student Management • Secure Login
    </div>

</div>

<script>

    // URL API untuk proses login
    const API_LOGIN = "http://localhost:3000/api/users/login";

    // Menjalankan proses ketika form login dikirim
    document.getElementById("formLogin").addEventListener(
        "submit",
        async function(event) {

            // Mencegah halaman melakukan refresh
            event.preventDefault();

            // Mengambil email dari input
            const email = document.getElementById("email").value.trim();

            // Mengambil password dari input
            const password = document.getElementById("password").value;

            // Mengambil tombol login
            const btnLogin = document.getElementById("btnLogin");

            // Mengambil elemen pesan
            const pesan = document.getElementById("pesan");

            // Menonaktifkan tombol saat proses berlangsung
            btnLogin.disabled = true;

            // Mengubah tulisan tombol
            btnLogin.textContent = "Memproses...";

            // Menghapus pesan sebelumnya
            pesan.textContent = "";

            try {

                // Mengirim email dan password ke REST API
                const response = await fetch(API_LOGIN, {
                    method: "POST",

                    // Memberitahu server bahwa data berupa JSON
                    headers: {
                        "Content-Type": "application/json"
                    },

                    // Mengubah data menjadi JSON
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                // Mengubah response API menjadi object JavaScript
                const hasil = await response.json();

                // Mengecek apakah login gagal
                if (!response.ok) {

                    // Menampilkan pesan error dari API
                    throw new Error(
                        hasil.message || "Login gagal"
                    );
                }

                // Menyimpan token login
                localStorage.setItem(
                    "token",
                    hasil.data.token
                );

                // Menyimpan informasi user
                localStorage.setItem(
                    "user",
                    JSON.stringify({
                        id: hasil.data.id,
                        nama: hasil.data.nama,
                        email: hasil.data.email
                    })
                );

                // Mengubah warna pesan menjadi hijau
                pesan.style.color = "#4ade80";

                // Menampilkan pesan berhasil
                pesan.textContent = "✓ Login berhasil!";

                // Menunggu sebelum membuka halaman utama
                setTimeout(function() {

                    // Membuka halaman index
                    window.location.href = "index.html";

                }, 800);

            } catch (error) {

                // Menampilkan error di console
                console.error(error);

                // Mengubah warna pesan menjadi merah
                pesan.style.color = "#f87171";

                // Menampilkan pesan error
                pesan.textContent = error.message;

            } finally {

                // Mengaktifkan kembali tombol
                btnLogin.disabled = false;

                // Mengembalikan tulisan tombol
                btnLogin.textContent = "Login";
            }
        }
    );

</script>
